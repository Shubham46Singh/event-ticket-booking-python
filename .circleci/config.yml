
version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install lint tools
          command: pip install -r requirements-dev.txt
      - run:
          name: Check code style
          command: ruff check app tests

  unit-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install -r requirements.txt
            python -m pip install -r requirements-dev.txt
      - run:
          name: Run unit tests with coverage
          command: |
            export PYTHONPATH="$PWD"
            python -m pytest tests/test_seats.py \
              --cov=app.seats \
              --cov-fail-under=70 \
              --cov-report=term-missing

  integration-tests:
    docker:
      - image: cimg/python:3.12
        environment:
          DATABASE_URL: postgres://assigner:assigner@localhost:5432/assigner
          REDIS_URL: redis://localhost:6379
      - image: postgres:16-alpine
        environment:
          POSTGRES_USER: assigner
          POSTGRES_PASSWORD: assigner
          POSTGRES_DB: assigner
      - image: redis:7-alpine
    steps:
      - checkout
      - run:
          name: Install dependencies and service clients
          command: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client redis-tools
            python -m pip install -r requirements.txt
            python -m pip install -r requirements-dev.txt
      - run:
          name: Wait for PostgreSQL and Redis
          command: |
            for i in $(seq 1 60); do
              if pg_isready -h localhost -p 5432 -U assigner -d assigner \
                 && redis-cli -h localhost -p 6379 ping | grep -q PONG; then
                echo "PostgreSQL and Redis are ready"
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "Services did not become ready"
                exit 1
              fi
              sleep 2
            done
      - run:
          name: Apply database migrations and seed data
          command: |
            export PGHOST=localhost
            export PGPORT=5432
            export PGUSER=assigner
            export PGPASSWORD=assigner
            export PGDATABASE=assigner
            psql -v ON_ERROR_STOP=1 -f migrations/001_schema.sql
            psql -v ON_ERROR_STOP=1 -f migrations/002_seed.sql
      - run:
          name: Run integration tests
          command: |
            export PYTHONPATH="$PWD"
            python -m pytest tests/test_integration.py -v

  secret-scan:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install Gitleaks
          command: |
            curl -fsSL \
              https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
              -o /tmp/gitleaks.tar.gz
            mkdir -p /tmp/gitleaks
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
            sudo install /tmp/gitleaks/gitleaks /usr/local/bin/gitleaks
      - run:
          name: Scan repository for secrets
          command: gitleaks detect --source . --redact --exit-code 1

  docker-build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            docker build -t event-ticket-booking:${CIRCLE_SHA1} .
            docker image inspect event-ticket-booking:${CIRCLE_SHA1}

workflows:
  event-ticket-booking:
    jobs:
      - lint
      - unit-tests:
          requires:
            - lint
      - integration-tests:
          requires:
            - unit-tests
      - secret-scan:
          requires:
            - integration-tests
      - docker-build:
          requires:
            - secret-scan
